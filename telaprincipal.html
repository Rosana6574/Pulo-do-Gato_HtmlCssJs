<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - João</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style data-purpose="custom-colors">
    /* Custom blue matching the image header and summary background */
    :root {
      --brand-blue: #1565C0;
      --card-bg-light-blue: rgba(255, 255, 255, 0.2);
    }
    .bg-brand-blue { background-color: var(--brand-blue); }
    .bg-summary-card { background-color: var(--card-bg-light-blue); }
  </style>
  <style data-purpose="shadows">
    /* Soft shadow for the menu cards */
    .menu-card-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>

<body class="bg-[#F8F9FA] min-h-screen font-sans">
    
    <header class="bg-brand-blue pt-12 pb-8 px-6 rounded-b-3xl">
        <div class="flex justify-between items-start mb-8">
            <a href="perfil.html">
                <div>
                    <p class="text-blue-100 text-lg">Olá,</p>
                    <h1 class="text-white text-3xl font-bold">João</h1>
                </div>
            </a>
            
            <a href="perfil.html">
                <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-white/50 bg-white shadow-sm">
                    <img alt="João's Avatar" class="w-full h-auto" src="https://i1-e.pinimg.com/736x/5a/9c/cb/5a9ccb0f2f0e61d2c96a1a409402001a.jpg"/>
                </div>
            </a>
            
        </div>

        <div class="flex gap-4">
            <div class="flex-1 bg-summary-card backdrop-blur-sm p-4 rounded-2xl text-white">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-yellow-400">⚡</span>
                    <span class="text-sm opacity-90">Energia</span>
                </div>
                <div class="text-xl font-bold">145 kWh</div>
                <p class="text-xs opacity-70 mt-1">Este mês</p>
            </div>

            <div class="flex-1 bg-summary-card backdrop-blur-sm p-4 rounded-2xl text-white">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-blue-200">💧</span>
                    <span class="text-sm opacity-90">Água</span>
                </div>
                <div class="text-xl font-bold">12 m³</div>
                <p class="text-xs opacity-70 mt-1">Este mês</p>
            </div>
        </div>
    
    </header>
   
    <main class="px-6 py-8">
        <h2 class="text-gray-800 text-xl font-bold mb-6">Menu</h2>
        <div class="space-y-4">

            <!-- Calculadora -->
            <a href="calcular.html" class="w-full flex items-center bg-white p-5 rounded-2xl menu-card-shadow transition-transform active:scale-95" data-purpose="menu-item">
                <div class="w-12 h-12 bg-blue-50 flex items-center justify-center rounded-xl mr-4">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <span class="text-gray-700 font-semibold text-lg">Calcular consumo</span>
            </a>

            <!-- Histórico -->
            <a href="historico.html" class="w-full flex items-center bg-white p-5 rounded-2xl menu-card-shadow transition-transform active:scale-95" data-purpose="menu-item">
                <div class="w-12 h-12 bg-blue-50 flex items-center justify-center rounded-xl mr-4">
                    <!-- History Icon Placeholder -->
                     <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <span class="text-gray-700 font-semibold text-lg">Histórico</span>
            </a>
            
            <!-- Alternativas econômicas -->
            <a href="alternativas.html" class="w-full flex items-center bg-white p-5 rounded-2xl menu-card-shadow transition-transform active:scale-95" data-purpose="menu-item">
                <div class="w-12 h-12 bg-blue-50 flex items-center justify-center rounded-xl mr-4">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <span class="text-gray-700 font-semibold text-lg text-left leading-tight">Alternativas econômicas</span>
            </a>
        
        </div>
    </main>
</body></html>
