<!-- ESTAR NO GIT -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar Conta - Signup Mobile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
 :root {
  --brand-blue: #1a73e8;
  --bg-light: #F7F9FC;
}

input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
}

input[type="password"]::-webkit-credentials-auto-fill-button,
input[type="password"]::-webkit-textfield-decoration-container {
  display: none !important;
}

.bg-brand-blue { background-color: var(--brand-blue); }
.text-brand-blue { color: var(--brand-blue); }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
</style>
</head>

<body class="bg-[#F7F9FC] min-h-screen">
  
  <header class="bg-brand-blue text-white px-4 h-24 flex items-center justify-center relative shadow-sm sticky top-0 z-50">
    <h1 class="text-lg font-bold">Criar conta</h1>
  </header>
  
  <main class="px-5 py-6">
    <p class="text-[#5E6C84] text-[15px] mb-8 leading-snug">
      Preencha seus dados para criar sua conta e começar a economizar.
    </p>
    
    <form class="space-y-6">
      
      <!-- Nome -->
      <div>
        <label class="block text-sm font-semibold mb-2">Nome completo</label>
        <input class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm" placeholder="Seu nome">
      </div>
      
      <!-- CPF -->
      <div>
        <label class="block text-sm font-semibold mb-2">CPF</label>
        <input 
        id="cpf"
        maxlength="14"
        oninput="mascaraCPF(this)"
        class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm" 
        placeholder="000.000.000-00">
      </div>
      
      <!-- Email -->
       <div>
        <label class="block text-sm font-semibold mb-2">E-mail</label>
        <input class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm" placeholder="seu@email.com">
      </div>
      
      <!-- SENHA -->
      <div>
        <label class="block text-sm font-semibold mb-2">Senha</label>
        <div class="relative">
          <input 
          id="senha" 
          type="password" 
          maxlength="6"
          class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm pr-12" 
          placeholder="Até 6 caracteres">
          
          <button type="button" onclick="toggleSenha('senha','iconeSenha')" class="absolute right-4 top-1/2 -translate-y-1/2 text-black">
            <svg id="iconeSenha" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
          </button>
        </div>
      </div>
      
      <!-- CONFIRMAR SENHA -->
      <div>
        <label class="block text-sm font-semibold mb-2">Confirmar Senha</label>
        <div class="relative">
          <input 
          id="confirmar" 
          type="password" 
          maxlength="6"
          class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm pr-12" 
          placeholder="Até 6 caracteres">
          
          <button type="button" onclick="toggleSenha('confirmar','iconeConfirmar')" class="absolute right-4 top-1/2 -translate-y-1/2 text-black">
            <svg id="iconeConfirmar" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
          </button>
        </div>
      </div>
      
      <!-- CEP -->
      <div>
        <label class="block text-sm font-semibold mb-2">CEP</label>
        <input 
        id="cep"
        maxlength="9"
        oninput="mascaraCEP(this)"
        class="w-full px-4 py-3.5 rounded-xl bg-white shadow-sm" 
        placeholder="00000-000">
      </div>
      
      <section class="mt-8">
        <h2 class="text-sm font-semibold mb-3">Tipo de residência</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="residencia bg-white py-3 rounded-xl shadow-sm" onclick="selecionar(this)">Apartamento</button>
          <button type="button" class="residencia bg-white py-3 rounded-xl shadow-sm" onclick="selecionar(this)">Casa</button>
          <button type="button" class="residencia bg-white py-3 rounded-xl shadow-sm" onclick="selecionar(this)">Kitnet</button>
          <button type="button" class="residencia bg-white py-3 rounded-xl shadow-sm" onclick="selecionar(this)">Sobrado</button>
        </div>
      </section>
      
      <!-- END: ResidenceType --> 
      <!-- BEGIN: SocialTariff --> 
      <div class="mt-10 p-5 bg-[#F1F5F9] rounded-2xl" data-purpose="social-tariff-card"> 
        <div class="flex items-center justify-between"> 
          <div class="flex items-center space-x-2"> 
            <span class="font-bold text-[#1E293B] text-sm">
              Tarifa social (baixa renda)
            </span> 
          </div> 
          <!-- Toggle Switch --> 
           <label class="relative inline-flex items-center cursor-pointer"> 
            <input class="sr-only peer" type="checkbox"/> 
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div> 
          </label> 
        </div> 
        <p class="mt-2 text-xs text-[#64748B] leading-normal pr-12"> 
          Marque se sua residência é cadastrada no programa de tarifa social. 
        </p> 
      </div>
      
      <button 
      type="button"
      onclick="criarConta()"
      class="w-full bg-brand-blue text-white py-4 rounded-2xl font-bold text-lg mt-8">
      Criar conta
      </button>
    
    </form>
  </main>

<script>

function mascaraCPF(campo){
let valor = campo.value.replace(/\D/g,'');

valor = valor.replace(/(\d{3})(\d)/,'$1.$2');
valor = valor.replace(/(\d{3})(\d)/,'$1.$2');
valor = valor.replace(/(\d{3})(\d{1,2})$/,'$1-$2');

campo.value = valor;
}

function mascaraCEP(campo){
let valor = campo.value.replace(/\D/g,'');

valor = valor.replace(/(\d{5})(\d)/,'$1-$2');

campo.value = valor;
}

function olhoAberto(svg){
svg.innerHTML = `
<path stroke-linecap="round" stroke-linejoin="round"
d="M2.036 12.322a1.012 1.012 0 010-.644C3.399 8.049 7.21 5 12 5c4.79 0 8.601 3.049 9.964 6.678a1.012 1.012 0 010 .644C20.601 15.951 16.79 19 12 19c-4.79 0-8.601-3.049-9.964-6.678z"/>
<path stroke-linecap="round" stroke-linejoin="round"
d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
`;
}

function olhoFechado(svg){
svg.innerHTML = `
<path stroke-linecap="round" stroke-linejoin="round"
d="M3 3l18 18"/>
<path stroke-linecap="round" stroke-linejoin="round"
d="M10.477 10.477a3 3 0 004.243 4.243"/>
<path stroke-linecap="round" stroke-linejoin="round"
d="M9.88 5.09A10.94 10.94 0 0112 5c4.79 0 8.601 3.049 9.964 6.678"/>
<path stroke-linecap="round" stroke-linejoin="round"
d="M6.228 6.228A10.97 10.97 0 002.036 11.678"/>
`;
}

function toggleSenha(inputId, iconId){
const input = document.getElementById(inputId);
const icon = document.getElementById(iconId);

if(input.type === "password"){
  input.type = "text";
  olhoFechado(icon); // fechado = mostra
}else{
  input.type = "password";
  olhoAberto(icon); // aberto = esconde
}
}

function selecionar(botao){
document.querySelectorAll('.residencia').forEach(btn=>{
btn.classList.remove('bg-blue-600','text-white');
btn.classList.add('bg-white');
});

botao.classList.remove('bg-white');
botao.classList.add('bg-blue-600','text-white');
}

window.onload = function(){
olhoAberto(document.getElementById("iconeSenha"));
olhoAberto(document.getElementById("iconeConfirmar"));
}

function criarConta(){
  localStorage.setItem("contaCriada", "true");
  window.location.href = "login_page.html";
}

</script>

</body>
</html>
