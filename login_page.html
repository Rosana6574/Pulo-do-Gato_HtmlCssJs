<!-- ESTAR NO GIT -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pulo do Gato - Login</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'pulo-blue': '#1a73e8',
        'pulo-text-dark': '#1a1a1a',
        'pulo-gray': '#707070',
        'pulo-border': '#e0e0e0',
      },
      fontFamily: {
        sans: ['Inter', 'sans-serif'],
      },
    }
  }
}
</script>

<style>
body {
  background-color: #ffffff;
  -webkit-tap-highlight-color: transparent;
}

.form-card {
  border-top-left-radius: 40px;
  border-top-right-radius: 40px;
  margin-top: -40px;
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
}

::placeholder {
  color: #bfbfbf !important;
  opacity: 1;
} 
</style>
</head>

<body class="font-sans antialiased min-h-screen flex flex-col">

<header class="bg-pulo-blue pt-12 pb-20 flex flex-col items-center justify-center text-center px-6">
  
  <div class="mb-4">
    <img 
      src="https://i.ibb.co/3ycRm6yK/Logo-Pulo-Do-Gato-removebg-preview.png"
      alt="Logo Pulo do Gato"
      class="h-28 w-auto object-contain"
    />
  </div>

  <h1 class="text-white text-3xl font-bold tracking-tight mb-1">
    Pulo do Gato
  </h1>

  <p class="text-white/90 text-sm font-medium">
    Controle de energia e água
  </p>

</header>

<main class="flex-grow bg-white form-card px-8 pt-10 pb-12 relative z-10">

  <div
  id="mensagemSucesso"
  class="hidden bg-green-100 border border-green-400 text-green-700 px-5 py-4 rounded-2xl mb-6 shadow-sm text-center font-semibold transition-all duration-500">
  Conta criada com sucesso!
  </div>
  
  <h2 class="text-pulo-text-dark text-2xl font-bold text-center mb-10">Entrar</h2>

  <form action="#" class="space-y-6" method="POST">

    <!-- SENHA -->
    <div class="space-y-1.5">
      <label class="block text-pulo-text-dark font-medium ml-1" for="senha">Senha</label>

      <div class="relative">
        <input
          class="block w-full px-4 py-4 rounded-xl border-pulo-border border focus:ring-pulo-blue focus:border-pulo-blue text-pulo-text-dark text-lg"
          id="senha"
          name="senha"
          type="password"
          placeholder="Digite sua senha"
        />

        <!-- OLHO -->
        <div onclick="toggleSenha()"
          class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-black">

          <svg id="iconeOlho" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path id="olhoPath1"></path>
            <path id="olhoPath2"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- CPF -->
    <div class="space-y-1.5">
      <label class="block text-pulo-text-dark font-medium ml-1" for="cpf">CPF</label>

      <input
        class="block w-full px-4 py-4 rounded-xl border-pulo-border border focus:ring-pulo-blue focus:border-pulo-blue text-pulo-text-dark text-lg"
        id="cpf"
        name="cpf"
        placeholder="000.000.000-00"
        type="text"
        maxlength="14"
        oninput="mascaraCPF(this)"
      />
    </div>

    <div class="flex justify-end pt-1">
      <a class="text-pulo-blue font-medium text-sm" href="#">Esqueceu a senha?</a>
    </div>

    <div class="pt-6">
      <button 
      onclick="window.location.href='telaprincipal.html'"
      class="w-full bg-pulo-blue text-white font-semibold py-4 rounded-xl text-lg shadow-md active:scale-[0.98] transition-transform"
      type="button">
      Entrar
      </button>
    </div>

  </form>

  <footer class="mt-10 text-center">
    <p class="text-pulo-gray font-medium">
      Não tem uma conta?
      <a class="text-pulo-blue font-semibold" href="cadastro.html">
        Criar conta
      </a>
    </p>
  </footer>

</main>

<script>
function mascaraCPF(campo) {
  let valor = campo.value.replace(/\D/g, "");

  valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
  valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
  valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

  campo.value = valor;
}

let mostrandoSenha = false;

function toggleSenha() {
  const senha = document.getElementById("senha");
  const iconeOlho = document.getElementById("iconeOlho");

  mostrandoSenha = !mostrandoSenha;

  if (mostrandoSenha) {
    senha.type = "text";

    // OLHO FECHADO COMPLETO
    iconeOlho.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 3l18 18M10.477 10.477a3 3 0 004.243 4.243M9.88 5.09A10.94 10.94 0 0112 5c4.79 0 8.601 3.049 9.964 6.678a1.012 1.012 0 010 .644A10.96 10.96 0 0118.91 14.12M6.228 6.228A10.97 10.97 0 002.036 11.678a1.012 1.012 0 000 .644C3.399 15.951 7.21 19 12 19c1.61 0 3.135-.344 4.51-.96"/>
    `;
  } else {
    senha.type = "password";

    // OLHO ABERTO
    iconeOlho.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M2.036 12.322a1.012 1.012 0 010-.644C3.399 8.049 7.21 5 12 5c4.79 0 8.601 3.049 9.964 6.678a1.012 1.012 0 010 .644C20.601 15.951 16.79 19 12 19c-4.79 0-8.601-3.049-9.964-6.678z"/>
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    `;
  }
}

window.onload = function () {

  const mensagem = document.getElementById("mensagemSucesso");

  if(localStorage.getItem("contaCriada") === "true"){
    mensagem.classList.remove("hidden");

    setTimeout(() => {
      mensagem.classList.add("hidden");
    }, 4000);

    localStorage.removeItem("contaCriada");
  }

  toggleSenha();
};
</script>

</body>
</html>
