<body class="bg-background min-h-screen flex flex-col">
    
    <header class="flex items-center justify-between px-margin py-4 w-full h-16 bg-primary dark:bg-primary-container shadow-md fixed top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="telaprincipal.html" class="text-on-primary dark:text-on-primary-container p-2 hover:bg-primary-container/20 rounded-full transition-transform active:scale-95 duration-200">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            </a>
            
            <h1 class="font-h2 text-h2 text-on-primary dark:text-on-primary-container">Resultado</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span class="font-h3 text-h3 text-on-primary"></span>
        </div>
    </header>
    
    <main class="flex-1 mt-20 mb-24 px-5 py-8 flex flex-col gap-6 max-w-2xl mx-auto w-full">
        <section class="bg-surface-container-lowest rounded-xl p-6 shadow border border-outline-variant/30 flex flex-col items-center">
            <h2 class="text-on-surface-variant mb-4">Consumo estimado</h2>

        <div class="flex flex-col items-center">
            <span id="resultadoConsumo" class="text-[64px] leading-tight text-on-background font-bold">0</span>
            <span class="text-on-surface-variant">kWh</span>
        </div>
    </section>
    
    <section class="bg-surface-container-lowest rounded-xl p-6 shadow border border-outline-variant/30 flex flex-col items-center">
        <h2 class="text-on-surface-variant mb-4">Estimativa da conta</h2>
        <div id="resultadoValor" class="text-4xl font-bold text-primary">
            R$ 0,00
        </div>
    </section>

    <section class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 flex gap-md items-start">
        <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-white" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
        </div>
        <div class="flex flex-col gap-xs">
            <h3 class="font-h3 text-[18px] text-on-surface font-semibold">Dica de economia</h3>
            <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                Desligue aparelhos da tomada quando não estiver usando. Isso pode reduzir até 10% da sua conta.
            </p>
        </div>
    </section>
    
    <div class="grid grid-cols-2 gap-md mt-4">
        
        <button 
          onclick="window.location.href='historico.html'"
          class="bg-surface-container-lowest border border-outline-variant text-on-surface-variant py-4 rounded-full font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95">
          Ver histórico
        </button>
        <button 
          onclick="window.location.href='calcular.html'"
          class="bg-primary text-on-primary py-4 rounded-full font-label-md text-label-md shadow-md hover:bg-primary-container transition-colors active:scale-95">
          Novo cálculo
        </button>
    </div>
</main>

<script>
window.onload = function(){

const consumo = localStorage.getItem("consumo");
const valorConta = localStorage.getItem("valorConta");

if(consumo){
document.getElementById("resultadoConsumo").textContent = consumo;
}

if(valorConta){
document.getElementById("resultadoValor").textContent = "R$ " + valorConta;
}

}
</script>
