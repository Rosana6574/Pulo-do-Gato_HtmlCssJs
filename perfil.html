<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Perfil do Usuário</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-blue': '#005EB8',
            'brand-bg': '#F9FAFB',
            'brand-border': '#E5E7EB',
            'brand-text-muted': '#6B7280',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>

<style data-purpose="custom-layout">
    body {
      background-color: #FFFFFF;
      font-family: 'Inter', sans-serif;
    }
    /* Hide scrollbar for cleaner mobile look */
    ::-webkit-scrollbar {
      display: none;
    }
</style>
</head>

<body class="w-full min-h-screen flex flex-col">
    <header class="bg-brand-blue text-white px-4 pt-12 pb-8 rounded-b-[20px] shadow-lg" data-purpose="header-container">
        <div class="flex items-center justify-between mb-4">
            <a href="telaprincipal.html" aria-label="Voltar" class="p-2 -ml-2">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
            </a>
            
            <h1 class="text-xl font-bold">Perfil</h1>

            <div class="relative group" data-purpose="user-avatar-container">
                <div class="w-20 h-20 rounded-full border-2 border-white overflow-hidden bg-gray-200">
                    <img alt="User Avatar" class="w-full h-full object-cover" src="https://i1-e.pinimg.com/736x/5a/9c/cb/5a9ccb0f2f0e61d2c96a1a409402001a.jpg"/>
                </div>
                <div class="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-sm">
                    <svg class="h-4 w-4 text-brand-blue" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"></path>
                    </svg>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end">
            <button class="text-xs font-medium underline opacity-90">Alterar foto</button>
        </div>
    </header>
    
    <main class="flex-grow px-6 py-8" data-purpose="profile-content">
        <section class="space-y-4 mb-8" data-purpose="user-info-section">
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">Nome completo</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    João Oliveira
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">Nome de usuário (@)</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    @joao
                </div>
            </div>
            
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">E-mail</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    joaooliveira@gmail.com
                </div>
            </div>
            
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">CPF</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    953.526.861-34
                </div>
            </div>
            
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">CEP</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    45324-567
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-700">ID do usuário</label>
                    <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800 text-sm">
                        #12070720
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-gray-700">Plano atual</label>
                    <div class="w-full px-4 py-3 border border-brand-blue/20 rounded-custom bg-blue-50 text-brand-blue font-bold text-sm text-center">
                        PREMIUM
                    </div>
                </div>
            </div>
            
            <div class="space-y-1">
                <label class="text-sm font-semibold text-gray-700">Data de criação da conta</label>
                <div class="w-full px-4 py-3 border border-brand-border rounded-custom bg-gray-50 text-gray-800">
                    15 de Março, 2023
                </div>
            </div>
            
            <button class="w-full flex items-center justify-center gap-2 bg-brand-blue text-white font-bold py-4 rounded-custom shadow-md hover:bg-blue-700 transition-colors mt-6" data-purpose="edit-profile-btn">
                Editar perfil
            </button>
        </section>

        <section class="mt-10" data-purpose="settings-section">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Configurações</h2>
            <div class="space-y-2">
                
                <!-- Notificações -->
                <button onclick="toggleSwitch(this)"
                  class="w-full flex items-center justify-between p-4 border border-brand-border rounded-custom bg-white">
                  <span class="font-medium text-gray-700">Notificações</span>
                  
                  <div class="switch bg-brand-blue w-10 h-6 rounded-full relative transition-all">
                    <div class="bola bg-white w-4 h-4 rounded-full absolute top-1 right-1 shadow-sm transition-all"></div>
                  </div>
                </button>
                
                <!-- Consumo -->
                <button onclick="toggleSwitch(this)"
                  class="w-full flex items-center justify-between p-4 border border-brand-border rounded-custom bg-white">
                  <span class="font-medium text-gray-700">Alerta de Consumo Alto</span>
                  
                  <div class="switch bg-brand-blue w-10 h-6 rounded-full relative transition-all">
                    <div class="bola bg-white w-4 h-4 rounded-full absolute top-1 right-1 shadow-sm transition-all"></div>
                  </div>
                </button>
                
                <!-- Lembrete -->
                <button onclick="toggleSwitch(this)"
                  class="w-full flex items-center justify-between p-4 border border-brand-border rounded-custom bg-white">
                  <span class="font-medium text-gray-700">Lembrete Mensal</span>
                  
                  <div class="switch bg-gray-200 w-10 h-6 rounded-full relative transition-all">
                    <div class="bola bg-white w-4 h-4 rounded-full absolute top-1 left-1 shadow-sm transition-all"></div>
                  </div>
                </button>

            </div>
        </section>

        <section class="mt-10" data-purpose="security-section">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Segurança</h2>

            <div class="space-y-2">
                <button class="w-full flex items-center justify-between p-4 border border-brand-border rounded-custom hover:bg-gray-50 transition-colors">
                    <div class="flex items-center gap-3">
                        <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2">
                            </path>
                        </svg>
                        
                        <span class="font-medium text-gray-700">
                            Alterar senha
                        </span>
                    </div>
                    
                    <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path clip-rule="evenodd"
                          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                          fill-rule="evenodd">
                        </path>
                    </svg>
                </button>
                
                <button class="w-full flex items-center justify-between p-4 border border-brand-border rounded-custom hover:bg-gray-50 transition-colors">
                    <div class="flex items-center gap-3">
                        <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                        <span class="font-medium text-gray-700">Dispositivos conectados</span>
                    </div>
                    
                    <span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full font-bold">2 ativos</span>
                </button>
            </div>
        </section>
    </main>
    
    <script>
        function toggleSwitch(botao) {
    const switchDiv = botao.querySelector('.switch');
    const bola = botao.querySelector('.bola');

    if (switchDiv.classList.contains('bg-brand-blue')) {
        switchDiv.classList.remove('bg-brand-blue');
        switchDiv.classList.add('bg-gray-200');

        bola.classList.remove('right-1');
        bola.classList.add('left-1');
    } else {
        switchDiv.classList.remove('bg-gray-200');
        switchDiv.classList.add('bg-brand-blue');

        bola.classList.remove('left-1');
        bola.classList.add('right-1');
    }}
    </script>
    
    <footer class="p-6 mt-auto">
        <button class="w-full flex items-center justify-center gap-2 text-red-600 font-bold py-4 border-2 border-red-100 rounded-custom hover:bg-red-50 transition-colors" data-purpose="logout-btn">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            Sair da conta
        </button>
    </footer>

</body></html>
